function buildDeck(seed){const names=IT.map(t=>t[0]),used=new Set(usedList);
 const fresh=ord(seed,IT.length).filter(i=>!used.has(names[i])),old=usedList.map(w=>names.indexOf(w)).filter(i=>i>=0);
 const pool=fresh.concat(old).slice(0,200),out=[];
 while(pool.length&&out.length<60){
  const lc=out.slice(-2).map(i=>IT[i][6]),lg=out.slice(-8).map(i=>IT[i][7]);
  let k=pool.findIndex(i=>!lc.includes(IT[i][6])&&!lg.includes(IT[i][7]));
  if(k<0)k=pool.findIndex(i=>!lg.includes(IT[i][7]));
  if(k<0)k=0;
  out.push(pool.splice(k,1)[0])}
 return out}

 }else if(g.phase==="end"){h+=`<div class="card"><h2 class="c">🏆 Lopputulokset</h2>${podium()}<button class="alt" data-a="again">Uusi peli</button></div>`}
 else{
  h+=`<div class="card"><div class="row"><span class="mut">Sana ${g.r+1}/${T(g)}</span><span class="badge">${PTS[k-1]} p</span></div>`;
  if(g.phase==="guess"){
   h+=`<p class="mut c">Vihje ${k}/5</p><p class="big2">${esc(it[k])}</p><p class="mut c">Vastanneet ${S.ans.length}/${S.gu.length}</p>`;
   if(k<5)h+=`<button data-a="clue">Seuraava vihje (${PTS[k]} p)</button>`;
   h+=`<button class="${k<5?"alt":""}" data-a="check">Tarkistus</button></div>`;
   if(k>1)h+=`<div class="card"><h2>Aiemmat vihjeet</h2><ul>${it.slice(1,k).map((t,i)=>`<li><span>${esc(t)}</span><b>${PTS[i]} p</b></li>`).reverse().join("")}</ul></div>`;
  }else{
   h+=`<p class="c mut">Oikea vastaus</p><p class="ans">${esc(it[0])}</p>`;
   h+=`<ul>${it.slice(1,k+1).map((t,i)=>`<li><span>${esc(t)}</span><b>${PTS[i]} p</b></li>`).join("")}</ul>`;
   h+=ck?"":'<p class="err">Tarkistaja ei ole yhdistettynä!</p>';
   if(!S.done)h+=`<p class="mut c">Tarkistaja merkitsee vastauksia…</p>`;
   h+=`<button data-a="next" ${S.done?"":"disabled"}>${g.r+1>=T(g)?"Lopputulokset":"Seuraava sana"}</button></div>`;
   if(S.done)h+=`<div class="card"><h2>Pisteet</h2><ul>${board()}</ul></div>`}
 }
 return h}

function playV(){
 const g=gs(),S=scores(),my=S.out[me.id]||{total:0},k=g?g.k||1:1;
 let h=`<h1>Kymppitonni</h1><div class="card"><div class="row"><span><span ${!g||g.phase==="lobby"?'class="avb" data-a="avatar"':""}>${av({av:me.av,n:me.name})}</span><b>${esc(me.name)}</b></span><b>${my.total} p</b></div>`;
 if(!g)h+=`<p class="mut">Odotetaan pelinjohtajaa…</p>`;
 else if(g.phase==="lobby")h+=`<p>Olet mukana! Odotetaan pelin alkua…</p><p class="mut">Voit vaihtaa profiilikuvan napauttamalla ympyrää ennen pelin alkua.</p>`;
 else if(g.phase==="end"){const arr=rankList(),mr=arr.find(o=>o.id===me.id);h+=`<p class="clue c">🏆 Peli päättyi</p>${mr?`<p class="c">Sijasi: <b>${mr.rank}.</b> (${mr.total} p)</p>`:""}${podium(arr)}`}
 else if(g.phase==="guess"){
  h+=`<p class="mut">Sana ${g.r+1}/${T(g)}</p><p>Pisteitä nyt: <span class="badge">${PTS[k-1]} p</span></p><p class="mut">Katso vihjeet ruudulta.</p>`;
  h+=mine.q===g.r?`<p>Vastauksesi <b>${esc(mine.ans)}</b> on lukittu (${mine.pts} p). Odota muita…</p>`:`<input id="ans" maxlength="40" placeholder="Mikä sana?" autocomplete="off"><button data-a="lock">Lukitse vastaus (${PTS[k-1]} p)</button><button class="alt" data-a="paper">📝 Vastasin paperille (${PTS[k-1]} p)</button>`}
 else{const o=S.out[me.id]||{};
  h+=mine.q!==g.r?`<p>Et vastannut tähän sanaan.</p>`:o.vd==null?`<p>Vastauksesi: <b>${esc(mine.ans)}</b> (${mine.pts} p)<br>Tarkistetaan…</p>`:o.vd?`<p class="clue" style="color:var(--ok)">✓ Oikein! +${mine.pts} p</p>`:`<p class="clue" style="color:var(--no)">✗ Väärin</p>`}
 return h+"</div>"}

function checkV(){
 const g=gs();
 if(g&&ckq!==g.r){ckq=g.r;myV={};room.presence({q:g.r,v:{}})}
 let h=`<h1>Tarkistaja</h1>`;
 if(!g)return h+`<div class="card"><p class="mut">Odotetaan pelinjohtajaa…</p></div>`;
 if(g.phase==="lobby"){const S0=scores(),pl=Object.values(S0.out).filter(o=>o.here);
  return h+`<div class="card"><h2>Pelin asetukset</h2><p class="mut">Sanoja pelissä</p><div class="row">${[5,10,20,40,60].map(k=>`<button class="${myCn===k?"":"alt"}" data-a="cn" data-n="${k}">${k}</button>`).join("")}</div>
<p class="mut">Aiemmin käytettyjä sanoja: ${usedList.length}/${IT.length}. Ne tulevat uudelleen vasta kun uudet on käyty läpi.${dbMsg?" "+esc(dbMsg):""}</p>${usedList.length?'<button class="alt" data-a="resethist">Nollaa käytetyt sanat</button>':""}
<h2>Pelaajat (${pl.length})</h2><ul>${pl.map(o=>`<li><span>${av(o)}${esc(o.n)}</span></li>`).join("")||'<li class="mut">Ei vielä pelaajia</li>'}</ul>
<button data-a="cgo" ${pl.length>=1?"":"disabled"}>Aloita peli</button></div>`}
 if(g.phase==="end")return h+`<div class="card"><h2 class="c">🏆 Lopputulokset</h2>${podium()}</div>`;
 const S=scores(),it=item(g),k=g.k||1;
 h+=`<div class="card"><span class="mut">Sana ${g.r+1}/${T(g)}</span><p class="mut c">Vihje ${k}/5 (${PTS[k-1]} p)</p><p class="big2">${esc(it[k])}</p>${g.phase==="check"?`<p class="c">Oikea sana:</p><p class="big2">${esc(it[0])}</p>`:""}
<button class="alt" data-a="allclues">${showAll?"Piilota kaikki vihjeet":"Näytä kaikki vihjeet"}</button>${showAll?`<ul>${[1,2,3,4,5].map(i=>`<li><span>${i}. ${esc(it[i])}</span><b>${PTS[i-1]} p</b></li>`).join("")}</ul>`:""}</div>`;
 if(g.phase!=="check")return h+`<div class="card"><p class="mut">Odotetaan vastauksia… ${S.ans.length}/${S.gu.length} vastannut</p></div>`;
 return h+`<div class="card"><h2>Merkitse vastaukset</h2>${S.ans.map(id=>{const o=S.out[id];return `<div style="margin-bottom:14px">${av(o)}<b>${esc(o.n)}</b>: ${esc(o.ans)} <span class="mut">(${o.pts} p)</span><div class="row"><button class="${myV[id]===1?"ok":"alt"}" data-a="mk" data-id="${esc(id)}" data-v="1">✓ Oikein</button><button class="${myV[id]===0?"no":"alt"}" data-a="mk" data-id="${esc(id)}" data-v="0">✗ Väärin</button></div></div>`}).join("")||'<p class="mut">Kukaan ei vastannut.</p>'}</div>`}

function render(){
 const ids=["cd","nm","ans"],fid=document.activeElement&&document.activeElement.id,g=gs();
 if(g&&g.r!==lastR){lastR=g.r;draft.ans=""}
 ids.forEach(i=>{const el=$("#"+i);if(el)draft[i]=el.value});
 $("#app").innerHTML=`<div class="dot ${room&&room.connected()?"on":""}"></div>`+(step==="home"?home():step==="role"?roleV():role==="h"?hostV():role==="c"?checkV():playV());
 ids.forEach(i=>{const el=$("#"+i);if(el)el.value=draft[i]||""});
 if(fid&&ids.includes(fid)&&$("#"+fid))$("#"+fid).focus()}

function toAvatar(file){return new Promise(res=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const S=64,c=document.createElement("canvas");c.width=c.height=S;const m=Math.min(img.width,img.height);c.getContext("2d").drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,S,S);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",0.55))};img.onerror=()=>res("");img.src=u})}
$("#avf").addEventListener("change",async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;const u=await toAvatar(f);if(!u)return;{const gg=gs();if(gg&&gg.phase!=="lobby"&&role==="p")return}me.av=u;ls.set("kt_av",u);if(role==="p"&&room)await room.presence({av:u});render()});
document.addEventListener("click",async e=>{
 const b=e.target.closest("[data-a]");if(!b)return;
 const a=b.dataset.a,g=gs(),set=p=>room.presence(p);
 if(a==="fs"){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>{});return}
 if(a==="avatar"){const gg=gs();if(!gg||gg.phase==="lobby")$("#avf").click();return}
 if(a==="host")return createGame();
 if(a==="join"){const c=($("#cd").value||"").trim();if(!/^\d{3}$/.test(c)){msg="Anna 3-numeroinen koodi.";return render()}
  if(await enter(c)){step="role";msg=""}return render()}
 if(a==="pl"||a==="ck"){
  const n=($("#nm").value||"").trim().slice(0,20);
  if(a==="pl"&&!n){msg="Kirjoita nimesi.";return render()}
  me.name=n;ls.set("kt_name",n);role=a==="pl"?"p":"c";msg="";
  await set(role==="p"?{role,id:me.id,name:n,...(me.av?{av:me.av}:{})}:{role,q:-1,v:{},cn:10});step="game";if(role==="c")loadUsed().then(render);return render()}
 if(a==="lock"||a==="paper"){const t=a==="paper"?"📝 Paperilla":($("#ans").value||"").trim().slice(0,40);
  if(!t||!g||g.phase!=="guess")return;
  const pt=PTS[(g.k||1)-1];mine={q:g.r,ans:t,pts:pt};draft.ans="";await set({q:g.r,ans:t,pts:pt});return render()}
 if(a==="allclues"){showAll=!showAll;return render()}
 if(a==="mk"){myV[b.dataset.id]=+b.dataset.v;await set({q:g.r,v:myV});return render()}
 if(a==="cn"){myCn=+b.dataset.n;await set({cn:myCn});return render()}
 if(a==="cgo"){await set({go:1});return render()}
 if(a==="n")return set({n:+b.dataset.n});
 if(a==="start"){await loadUsed();await set({phase:"guess",r:0,k:1,base:{},deck:buildDeck(g.seed)});await markUsed(word(gs()));return render()}
 if(a==="resethist"){usedList=[];await saveUsed();return render()}
 if(a==="clue")return set({k:Math.min(5,(g.k||1)+1)});
 if(a==="check")return set({phase:"check"});
 if(a==="next"){const base={};for(const [id,o] of Object.entries(scores().out))base[id]=[o.total,o.n||"?"];
  await set({base,r:g.r+1,k:1,phase:g.r+1>=T(g)?"end":"guess"});const g2=gs();if(g2&&g2.phase==="guess")await markUsed(word(g2));return render()}
 if(a==="again")location.reload()});

const fsb=$("#fs");
if(document.fullscreenEnabled){fsb.hidden=false;document.addEventListener("fullscreenchange",()=>{fsb.textContent=document.fullscreenElement?"✕ Poistu":"⛶ Koko näyttö"})}
render();
initFirebase();
</script></body></html>
