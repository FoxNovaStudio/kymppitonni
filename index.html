function scores(){
 const g=gs(),E={out:{},gu:[],ans:[],done:false};if(!g)return E;
 const pl=players(),out={};
 for(const id in g.base||{})out[id]={n:g.base[id][1],s:g.base[id][0],here:false,d:0};
 for(const id in pl){const p=pl[id],o=out[id]||(out[id]={s:0,d:0});o.n=p.name;o.here=true;if(p.q===g.r&&p.ans!=null){o.ans=p.ans;o.pts=PTS.includes(+p.pts)?+p.pts:2}}

 const gu=Object.keys(out).filter(id=>out[id].here),ans=gu.filter(id=>out[id].ans!=null);
 ans.forEach(id=>{if(v[id]!=null)out[id].vd=v[id]});
 const done=g.phase==="check"&&ans.every(id=>out[id].vd!=null);
 if(g.phase==="check")ans.forEach(id=>{if(out[id].vd===1)out[id].d=out[id].pts});
 for(const id in out)out[id].total=out[id].s+out[id].d;
 return{out,gu,ans,done}}

async function createGame(){
 for(let i=0;i<4;i++){
  const c=String(100+Math.floor(Math.random()*900));
  if(!await enter(c))return render();
  await room.presence({role:"h",phase:"lobby",r:0,k:1,n:10,base:{},seed:Math.floor(Math.random()*1e9)});
  await new Promise(r=>setTimeout(r,1500));
  if(!room.peers().some(p=>p.presence.role==="h"&&!p.isMe)){role="h";step="game";msg="";loadUsed().then(render);return render()}

   h+=ck?"":'<p class="err">Tarkistaja ei ole yhdistettynä!</p>';
   if(S.done)h+=`<p class="c">Sana oli</p><p class="big2">${esc(it[0])}</p>`;else h+=`<p class="mut c">Tarkistaja merkitsee vastauksia…</p>`;
   h+=`<ul>${S.gu.map(id=>{const o=S.out[id];return `<li><span>${esc(o.n)}: ${o.ans!=null?esc(o.ans):"—"}${o.ans!=null?` <span class="mut">(${o.pts} p)</span>`:""}</span><b>${o.ans==null?"–":o.vd==null?"…":o.vd?"✓ +"+o.d:"✗"}</b></li>`}).join("")}</ul>`;
   h+=`<button data-a="next" ${S.done?"":"disabled"}>${g.r+1>=T(g)?"Lopputulokset":"Seuraava sana"}</button></div>`}
 }
 if(g.phase!=="lobby")h+=`<div class="card"><h2>Pisteet</h2><ul>${board()}</ul></div>`;
 return h}

function playV(){
 const g=gs(),S=scores(),my=S.out[me.id]||{total:0},k=g?g.k||1:1;
 let h=`<h1>Kymppitonni</h1><div class="card"><div class="row"><b>${esc(me.name)}</b><b>${my.total} p</b></div>`;
 if(!g)h+=`<p class="mut">Odotetaan pelinjohtajaa…</p>`;
 else if(g.phase==="lobby")h+=`<p>Olet mukana! Odotetaan pelin alkua…</p>`;
 else if(g.phase==="end")h+=`<p class="clue">Peli päättyi</p><ul>${board()}</ul>`;
 else if(g.phase==="guess"){
  h+=`<p class="mut">Sana ${g.r+1}/${T(g)}</p><p>Pisteitä nyt: <span class="badge">${PTS[k-1]} p</span></p><p class="mut">Katso vihjeet ruudulta.</p>`;
  h+=mine.q===g.r?`<p>Vastauksesi <b>${esc(mine.ans)}</b> on lukittu (${mine.pts} p). Odota muita…</p>`:`<input id="ans" maxlength="40" placeholder="Mikä sana?" autocomplete="off"><button data-a="lock">Lukitse vastaus (${PTS[k-1]} p)</button><button class="alt" data-a="paper">📝 Vastasin paperille (${PTS[k-1]} p)</button>`}
 else{const o=S.out[me.id]||{};
  h+=mine.q!==g.r?`<p>Et vastannut tähän sanaan.</p>`:o.vd==null?`<p>Vastauksesi: <b>${esc(mine.ans)}</b> (${mine.pts} p)<br>Tarkistetaan…</p>`:o.vd?`<p class="clue" style="color:var(--ok)">✓ Oikein! +${mine.pts} p</p>`:`<p class="clue" style="color:var(--no)">✗ Väärin</p>`}
 return h+"</div>"}

function checkV(){
 const g=gs();
 if(g&&ckq!==g.r){ckq=g.r;myV={};room.presence({q:g.r,v:{}})}
 let h=`<h1>Tarkistaja</h1>`;
 if(!g||g.phase==="lobby")return h+`<div class="card"><p class="mut">Odotetaan pelin alkua…</p></div>`;
 if(g.phase==="end")return h+`<div class="card"><h2>Peli päättyi</h2><ul>${board()}</ul></div>`;
 const S=scores(),it=item(g),k=g.k||1;
 h+=`<div class="card"><span class="mut">Sana ${g.r+1}/${T(g)}</span><p class="mut c">Vihje ${k}/5 (${PTS[k-1]} p)</p><p class="big2">${esc(it[k])}</p>${g.phase==="check"?`<p class="c">Oikea sana:</p><p class="big2">${esc(it[0])}</p>`:""}
<button class="alt" data-a="allclues">${showAll?"Piilota kaikki vihjeet":"Näytä kaikki vihjeet"}</button>${showAll?`<ul>${[1,2,3,4,5].map(i=>`<li><span>${i}. ${esc(it[i])}</span><b>${PTS[i-1]} p</b></li>`).join("")}</ul>`:""}</div>`;
 if(g.phase!=="check")return h+`<div class="card"><p class="mut">Odotetaan vastauksia… ${S.ans.length}/${S.gu.length} vastannut</p></div>`;
 return h+`<div class="card"><h2>Merkitse vastaukset</h2>${S.ans.map(id=>{const o=S.out[id];return `<div style="margin-bottom:14px"><b>${esc(o.n)}</b>: ${esc(o.ans)} <span class="mut">(${o.pts} p)</span><div class="row"><button class="${myV[id]===1?"ok":"alt"}" data-a="mk" data-id="${esc(id)}" data-v="1">✓ Oikein</button><button class="${myV[id]===0?"no":"alt"}" data-a="mk" data-id="${esc(id)}" data-v="0">✗ Väärin</button></div></div>`}).join("")||'<p class="mut">Kukaan ei vastannut.</p>'}</div>`}

function render(){
 const ids=["cd","nm","ans"],fid=document.activeElement&&document.activeElement.id,g=gs();
 if(g&&g.r!==lastR){lastR=g.r;draft.ans=""}
 ids.forEach(i=>{const el=$("#"+i);if(el)draft[i]=el.value});
 $("#app").innerHTML=`<div class="dot ${room&&room.connected()?"on":""}"></div>`+(step==="home"?home():step==="role"?roleV():role==="h"?hostV():role==="c"?checkV():playV());
 ids.forEach(i=>{const el=$("#"+i);if(el)el.value=draft[i]||""});
 if(fid&&ids.includes(fid)&&$("#"+fid))$("#"+fid).focus()}

document.addEventListener("click",async e=>{
 const b=e.target.closest("[data-a]");if(!b)return;
 const a=b.dataset.a,g=gs(),set=p=>room.presence(p);
 if(a==="fs"){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>{});return}
 if(a==="host")return createGame();
 if(a==="join"){const c=($("#cd").value||"").trim();if(!/^\d{3}$/.test(c)){msg="Anna 3-numeroinen koodi.";return render()}
  if(await enter(c)){step="role";msg=""}return render()}
 if(a==="pl"||a==="ck"){
  const n=($("#nm").value||"").trim().slice(0,20);
  if(a==="pl"&&!n){msg="Kirjoita nimesi.";return render()}
  me.name=n;ls.set("kt_name",n);role=a==="pl"?"p":"c";msg="";
  await set(role==="p"?{role,id:me.id,name:n}:{role,q:-1,v:{}});step="game";return render()}
 if(a==="lock"||a==="paper"){const t=a==="paper"?"📝 Paperilla":($("#ans").value||"").trim().slice(0,40);
  if(!t||!g||g.phase!=="guess")return;
  const pt=PTS[(g.k||1)-1];mine={q:g.r,ans:t,pts:pt};draft.ans="";await set({q:g.r,ans:t,pts:pt});return render()}
 if(a==="allclues"){showAll=!showAll;return render()}
 if(a==="mk"){myV[b.dataset.id]=+b.dataset.v;await set({q:g.r,v:myV});return render()}
 if(a==="n")return set({n:+b.dataset.n});
 if(a==="start"){await loadUsed();await set({phase:"guess",r:0,k:1,base:{},deck:buildDeck(g.seed)});await markUsed(word(gs()));return render()}
 if(a==="resethist"){usedList=[];await saveUsed();return render()}
 if(a==="clue")return set({k:Math.min(5,(g.k||1)+1)});
 if(a==="check")return set({phase:"check"});
 if(a==="next"){const base={};for(const [id,o] of Object.entries(scores().out))base[id]=[o.total,o.n||"?"];
  await set({base,r:g.r+1,k:1,phase:g.r+1>=T(g)?"end":"guess"});const g2=gs();if(g2&&g2.phase==="guess")await markUsed(word(g2));return render()}
 if(a==="again")location.reload()});

const fsb=$("#fs");
if(document.fullscreenEnabled){fsb.hidden=false;document.addEventListener("fullscreenchange",()=>{fsb.textContent=document.fullscreenElement?"✕ Poistu":"⛶ Koko näyttö"})}
render();
initFirebase();
</script></body></html>
